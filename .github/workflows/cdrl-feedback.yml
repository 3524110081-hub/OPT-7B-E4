name: CDRL feedback

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify reproducibility contract
        shell: bash
        run: |
          set -euo pipefail
          make setup

      - name: Fix DynamoDB Local permissions
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: dummy
          AWS_SECRET_ACCESS_KEY: dummy
          AWS_DEFAULT_REGION: us-east-1
          AWS_PAGER: ""
          AWS_MAX_ATTEMPTS: "1"
        run: |
          set -euo pipefail

          echo "=== Corrigiendo propietario de la carpeta de DynamoDB ==="

          docker compose exec -T -u 0 dynamodb sh -lc \
            'chown -R 1000:1000 /home/dynamodblocal/data'

          echo "=== Verificando permisos corregidos ==="

          docker compose exec -T dynamodb sh -lc \
            'ls -ldn /home/dynamodblocal/data'

          echo "=== Reiniciando DynamoDB Local ==="

          docker compose restart dynamodb

          echo "=== Comprobando conexión con DynamoDB ==="

          for attempt in $(seq 1 10); do
            echo "Intento $attempt de 10"

            if aws dynamodb list-tables \
              --endpoint-url http://127.0.0.1:8000 \
              --region us-east-1 \
              --cli-connect-timeout 2 \
              --cli-read-timeout 3; then
              echo "PASS - DynamoDB Local funciona correctamente."
              exit 0
            fi

            sleep 2
          done

          echo "ERROR - DynamoDB Local sigue sin responder."
          echo "=== Registros de DynamoDB ==="
          docker compose logs --no-color --tail=150 dynamodb
          exit 1
