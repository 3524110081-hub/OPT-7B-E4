name: CDRL feedback

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify reproducibility contract
        shell: bash
        run: |
          set -euo pipefail
          make setup

      - name: Wait for DynamoDB Local
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: dummy
          AWS_SECRET_ACCESS_KEY: dummy
          AWS_DEFAULT_REGION: us-east-1
          AWS_PAGER: ""
        run: |
          set -euo pipefail
          echo "Esperando a que DynamoDB Local esté disponible..."

          for attempt in $(seq 1 60); do
            if aws dynamodb list-tables \
              --endpoint-url http://127.0.0.1:8000 \
              --region us-east-1 > /dev/null 2>&1; then
              echo "PASS - DynamoDB Local está disponible."
              exit 0
            fi

            sleep 2
          done

          echo "ERROR - DynamoDB Local no respondió después de 120 segundos."
          docker compose ps
          docker compose logs --no-color dynamodb
          exit 1

      - name: Verify project
        shell: bash
        run: |
          set -euo pipefail
          make verify
