name: CDRL feedback

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify reproducibility contract
        shell: bash
        run: |
          set -euo pipefail
          make setup

      - name: Diagnose DynamoDB Local
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: dummy
          AWS_SECRET_ACCESS_KEY: dummy
          AWS_DEFAULT_REGION: us-east-1
          AWS_PAGER: ""
          AWS_RETRY_MODE: standard
          AWS_MAX_ATTEMPTS: "1"
        run: |
          set -euo pipefail

          echo "=== Estado de los contenedores ==="
          docker compose ps -a

          echo "=== Registros iniciales de DynamoDB ==="
          docker compose logs --no-color --tail=80 dynamodb || true

          echo "=== Permisos de la base de datos ==="
          docker compose exec -T dynamodb sh -lc \
            'id; ls -lan /home/dynamodblocal/data' || true

          echo "=== Comprobando conexión con DynamoDB ==="

          for attempt in $(seq 1 10); do
            echo "Intento $attempt de 10"

            if aws dynamodb list-tables \
              --endpoint-url http://127.0.0.1:8000 \
              --region us-east-1 \
              --cli-connect-timeout 2 \
              --cli-read-timeout 3; then
              echo "PASS - DynamoDB Local está disponible."
              exit 0
            fi

            sleep 2
          done

          echo "ERROR - DynamoDB Local no responde correctamente."
          echo "=== Estado final de los contenedores ==="
          docker compose ps -a
          echo "=== Registros finales de DynamoDB ==="
          docker compose logs --no-color --tail=150 dynamodb
          exit 1
